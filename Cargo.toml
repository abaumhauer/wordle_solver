[package]
name = "wordle_solver"
version = "0.2.0"
edition = "2024"

[dependencies]
rayon = "1.11"           # Parallel processing
term_size = "0.3"       # Terminal sizing
colored = "2.2"         # Output coloring
serde = { version = "1.0", features = ["derive"] } # Serialization framework
bincode = "1.3"         # Binary format (Fast cache)
sha2 = "0.10"           # Hashing the dictionary
hex = "0.4"             # Displaying hash as string
clap = { version = "4.5", features = ["derive"] }  # CLI Argument parsing
